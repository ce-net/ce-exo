# ce-exo model registry — the catalog the router and planner budget against.
#
# `weight_mb` is the on-disk (quantized) weight size; `layers` is the transformer block count (the
# unit of pipeline splitting). `object_cid` is the CE object CID of the GGUF once published to the
# mesh (workers fetch + verify it over the blob store); leave it unset for models not yet published.

