<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ce-exo</title>
<style>
  :root {
    --bg: #0b0d10; --panel: #14171c; --line: #232830; --ink: #e7ebf0;
    --muted: #8a93a0; --accent: #5eead4; --user: #1b2a2f; --warn: #f3a;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 system-ui, -apple-system, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 14px; padding: 12px 18px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header .mark { font-family: var(--mono); font-weight: 700; letter-spacing: .5px; }
  header .mark b { color: var(--accent); }
  header .tag { color: var(--muted); font-size: 12px; }
  select, input, button {
    background: var(--bg); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; font: inherit;
  }
  select { min-width: 180px; }
  header .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  #log { flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 16px; }
  .turn { max-width: 760px; width: 100%; margin: 0 auto; }
  .role { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .8px; }
  .bubble { white-space: pre-wrap; word-wrap: break-word; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); }
  .user .bubble { background: var(--user); border-color: #25393f; }
  .assistant .bubble { background: var(--panel); }
  .empty { color: var(--muted); text-align: center; margin-top: 12vh; }
  .empty b { color: var(--accent); font-family: var(--mono); }
  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 18px; }
  .composer { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; }
  .composer textarea { flex: 1; resize: none; height: 46px; max-height: 180px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font: inherit; }
  .composer button { padding: 0 20px; background: var(--accent); color: #05201b; border: none; font-weight: 600; cursor: pointer; }
  .composer button:disabled { opacity: .5; cursor: default; }
  .err { color: var(--warn); }
</style>
</head>
<body>
  <header>
    <span class="mark"><b>ce</b>-exo</span>
    <span class="tag">LLMs across your mesh</span>
    <div class="right">
      <select id="model" title="model"></select>
      <button id="refresh" title="reload models">↻</button>
    </div>
  </header>

  <div id="log">
    <div class="empty">talk to <b>ce-exo</b> — pick a model and say something.</div>
  </div>

  <footer>
    <div class="composer">
      <textarea id="input" placeholder="Message… (Enter to send, Shift+Enter for newline)"></textarea>
      <button id="send">Send</button>
    </div>
  </footer>

<script>
const $ = (s) => document.querySelector(s);
const log = $("#log"), modelSel = $("#model"), input = $("#input"), sendBtn = $("#send");
const history = [];
let busy = false;

async function loadModels() {
  modelSel.innerHTML = "";
  try {
    const r = await fetch("/v1/models");
    const j = await r.json();
    const ids = (j.data || []).map((m) => m.id);
    if (!ids.length) { modelSel.add(new Option("(no models)", "")); return; }
    ids.forEach((id) => modelSel.add(new Option(id, id)));
  } catch (e) {
    modelSel.add(new Option("(router unreachable)", ""));
  }
}

function addTurn(role, text) {
  if (log.querySelector(".empty")) log.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "turn " + role;
  wrap.innerHTML = `<div class="role">${role}</div><div class="bubble"></div>`;
  wrap.querySelector(".bubble").textContent = text;
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
  return wrap.querySelector(".bubble");
}

async function send() {
  const text = input.value.trim();
  const model = modelSel.value;
  if (!text || busy) return;
  if (!model) { addTurn("assistant", "Pick a model first.").classList.add("err"); return; }
  busy = true; sendBtn.disabled = true; input.value = "";

  addTurn("user", text);
  history.push({ role: "user", content: text });
  const out = addTurn("assistant", "");

  try {
    const resp = await fetch("/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model, messages: history, stream: true }),
    });
    if (!resp.ok) throw new Error("router " + resp.status + ": " + (await resp.text()));

    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "", full = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const frame = buf.slice(0, i); buf = buf.slice(i + 2);
        for (const line of frame.split("\n")) {
          if (!line.startsWith("data: ")) continue;
          const data = line.slice(6).trim();
          if (data === "[DONE]") continue;
          try {
            const tok = JSON.parse(data).choices?.[0]?.delta?.content;
            if (tok) { full += tok; out.textContent = full; log.scrollTop = log.scrollHeight; }
          } catch {}
        }
      }
    }
    history.push({ role: "assistant", content: full });
  } catch (e) {
    out.textContent = String(e.message || e);
    out.classList.add("err");
  } finally {
    busy = false; sendBtn.disabled = false; input.focus();
  }
}

sendBtn.onclick = send;
$("#refresh").onclick = loadModels;
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
loadModels();
</script>
</body>
</html>
